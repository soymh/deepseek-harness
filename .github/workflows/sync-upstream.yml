name: Sync upstream

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/deepseek-ai/deepseek-harness.git
  TARGET_BRANCH: feat/desktop-linux-appimage

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Merge upstream into the Linux branch
        id: merge
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream "$UPSTREAM" 2>/dev/null || git remote set-url upstream "$UPSTREAM"
          git fetch --no-tags upstream master
          sha=$(git rev-parse FETCH_HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$sha" HEAD; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Already contains upstream.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          if git merge --no-edit -m "chore: sync upstream ${sha:0:12}" "$sha"; then
            git push origin "HEAD:$TARGET_BRANCH"
            echo 'clean=true' >> "$GITHUB_OUTPUT"
            echo "Merged upstream $sha." >> "$GITHUB_STEP_SUMMARY"
          else
            git diff --name-only --diff-filter=U > /tmp/conflicts.txt
            git merge --abort
            {
              echo '### Upstream sync needs manual resolution'
              echo
              echo "Merging upstream \`$sha\` into \`$TARGET_BRANCH\` conflicts in:"
              echo
              sed 's/^/- `/; s/$/`/' /tmp/conflicts.txt
              echo
              echo 'Resolve locally, push the branch, then dispatch the Linux package workflow.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Build the merged branch without publishing
        if: steps.merge.outputs.clean == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run linux-package.yml --ref "$TARGET_BRANCH" -f publish=false
